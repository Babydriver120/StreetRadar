name: StreetRadar
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0

schemes:
  StreetRadar:
    build:
      targets:
        StreetRadar: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  StreetRadar:
    type: application
    platform: iOS
    sources:
      - path: StreetRadar
    dependencies:
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.streetradar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        DEVELOPMENT_TEAM: ""
    info:
      path: StreetRadar/Info.plist
      properties:
        CFBundleDisplayName: StreetRadar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "StreetRadar braucht deinen Standort, um dich auf der Karte zu zeigen und dich zu navigieren."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Damit die Navigation weiterläuft, wenn du die App verlässt oder das iPhone sperrst."
        UIBackgroundModes: [location, audio]
